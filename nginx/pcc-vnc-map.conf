# Strip the pveauth parameter from WebSocket query strings before proxying to Proxmox.
# Proxmox rejects any unknown query parameters with a 400 schema error.
# We use $args (raw, encoded query string) and regex to remove &pveauth=... or pveauth=...&
# leaving port and vncticket intact in their original encoded form.

map $args $pcc_clean_args {
    # pveauth at end:   port=N&vncticket=T&pveauth=A
    ~^(?P<before>.+)&pveauth=[^&]*$    $before;

    # pveauth in middle: port=N&pveauth=A&vncticket=T
    ~^(?P<before>.+)&pveauth=[^&]*(?P<after>&.+)$  "${before}${after}";

    # pveauth at start:  pveauth=A&port=N&vncticket=T
    ~^pveauth=[^&]*&(?P<after>.+)$     $after;

    # pveauth only: pveauth=A
    ~^pveauth=[^&]*$                   "";

    default $args;
}
