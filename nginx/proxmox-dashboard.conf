server {
    listen 8080;
    server_name _;

    root /var/www/proxmox-dashboard;
    index index.html;

    # VNC/term WebSocket — extracts pveauth query param and injects as Authorization header.
    # Browsers cannot set custom headers on WebSocket connections, so PVE auth is
    # passed in the URL and nginx converts it here before forwarding to Proxmox.
    location ~ /vncwebsocket|/termproxy {
        # Inject PVE auth from query param as Authorization header,
        # then forward to Proxmox with pveauth stripped from the query string.
        proxy_pass https://127.0.0.1:8006$uri?$pcc_clean_args;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host 127.0.0.1:8006;
        proxy_set_header Authorization $arg_pveauth;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Handle CORS preflight for all API calls
    location /api2/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, CSRFPreventionToken, Content-Type';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Length' 0;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, CSRFPreventionToken, Content-Type' always;

        proxy_pass https://127.0.0.1:8006;
        proxy_ssl_verify off;
        proxy_http_version 1.1;

        # WebSocket support — required for noVNC and xterm.js consoles
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host 127.0.0.1:8006;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header CSRFPreventionToken $http_csrfpreventiontoken;
        proxy_set_header Cookie $http_cookie;

        proxy_pass_header Set-Cookie;
        proxy_pass_header CSRFPreventionToken;

        client_max_body_size 50G;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
